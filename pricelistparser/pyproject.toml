[project]
name = "pricelistparser"
version = "0.1.0"
description = "Raw extraction of supplier price-list files into a supplier-neutral JSON contract."
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "reportlab>=4.2",  # generates the synthetic golden-test fixture only
]

[project.scripts]
pricelistparser = "pricelistparser.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
