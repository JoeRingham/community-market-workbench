name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pricelistparser
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for public repos. For a private repo under an org, set GITLEAKS_LICENSE.

  # api job (Go) will be added with the first api/ code.
